window:
  # padding: # For having space at the edges
  #   x: 6
  #   y: 6
  # dynamic_padding: false
  
  opacity: 0.8 #0.80 # For transparency
draw_bold_text_with_bright_colors: true

mouse:
  hide_when_typing: true

font:
  normal:
    family: JetBrainsMono Nerd Font Mono
    style: Bold

# Cyberpunk-Neon colours
colors:
  # Default colours
  primary:
    background: '0x000b1e'
    foreground: '0x0abdc6'

  # Colors that should be used to draw the terminal cursor. If these are unset,
  # the cursor colour will be the inverse of the cell colour.
  cursor:
    text: '0x2e2e2d'
    # text: '0x000000'
    cursor: '0xffffff'

      #  # Normal colors
      #  normal:
      #    black:   '0x123e7c'
      #    red:     '0xff0000'
      #    green:   '0xd300c4'
      #    yellow:  '0xf57800'
      #    blue:    '0x123e7c'
      #    magenta: '0x711c91'
      #    cyan:    '0x0abdc6'
      #    white:   '0xd7d7d5'
      #
      # Bright colors
    bright:
      black:   '0x1c61c2'
      red:     '0xff0000'
      green:   '0xd300c4'
      yellow:  '0xf57800'
      blue:    '0x00ff00'
      magenta: '0x711c91'
      cyan:    '0x0abdc6'
      white:   '0xd7d7d5'

